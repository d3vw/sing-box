name: Build Custom Linux AMD64

on:
  push:
    branches:
      - custom
  workflow_dispatch:

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.25.9

      - name: Build binary
        run: |
          go build -mod=mod -o sing-box-linux-amd64 ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: sing-box-linux-amd64
